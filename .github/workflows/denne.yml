# gta6bananaclips: every day on GitHub's servers (no home PC needed)
#   1. klipuj.py batch   -> render the best fresh moments (Twitch, Kick, YouTube)
#   2. publikuj.py den   -> deploy videos to Netlify + schedule today's slots in Buffer
#   3. commit state      -> what was rendered / published / which facecam boxes
# Buffer then publishes on its own during the day.
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   BUFFER_API_KEY_1, BUFFER_API_KEY_2, NETLIFY_AUTH_TOKEN
# Variables (same page -> Variables):
#   NETLIFY_SITE_ID, MEDIA_BASE_URL, OSTRE (set to 1 to schedule for real; otherwise Buffer drafts)
# YouTube is off here: it blocks GitHub's servers ("confirm you're not a bot").

name: denne-klipy

on:
  schedule:                        # 3 runs a day share one daily quota (launch-day moments go out the same day)
    - cron: "30 4 * * *"          # 05:30 CET: last night's US streams
    - cron: "0 12 * * *"          # 13:00 CET: morning / UK afternoon streams
    - cron: "0 18 * * *"          # 19:00 CET: UK evening / US afternoon streams
  workflow_dispatch:
    inputs:
      max:
        description: "max shorts to render (empty = today's ramp quota from sources.json)"
        default: ""
      yt:
        description: "of which from YouTube (needs secret YT_COOKIES on GitHub servers)"
        default: "3"
      url:
        description: "test: render just this one clip URL"
        default: ""
      publikovat:
        description: "test: publish that one clip too (ano/ne)"
        default: "ne"

permissions:
  contents: write

concurrency:
  group: denne
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BUFFER_API_KEY_1: ${{ secrets.BUFFER_API_KEY_1 }}
      BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: denoland/setup-deno@v2      # yt-dlp solves YouTube's JS challenge with deno
        with:
          deno-version: v2.x

      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: python deps (CPU torch, no GPU on the runner)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - uses: actions/cache@v4
        with:
          path: models/whisper
          key: whisper-small.en

      - name: warn when secrets are missing (publishing would be skipped silently)
        if: env.BUFFER_API_KEY_1 == '' || env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::error::Chybi secret BUFFER_API_KEY_1 nebo NETLIFY_AUTH_TOKEN - nic se nepublikuje."

      - name: YouTube cookies (GitHub servers are asked "confirm you're not a bot" without them)
        if: env.YT_COOKIES != ''
        run: echo "$YT_COOKIES" > youtube_cookies.txt

      - name: Buffer channels (first run only)
        if: inputs.url == '' && hashFiles('buffer.json') == '' && env.BUFFER_API_KEY_1 != ''
        run: python publikuj.py kanaly

      - name: render one test clip
        if: inputs.url != ''
        run: |
          case "${{ inputs.url }}" in
            *youtube.com*|*youtu.be*) python klipuj.py --whisper small.en yt "${{ inputs.url }}" --n 1 ;;
            *) python klipuj.py --whisper small.en one "${{ inputs.url }}" ;;
          esac

      - name: render (only as many as today's quota still allows)
        if: inputs.url == ''
        run: |
          n="${{ inputs.max }}"
          [ -z "$n" ] && n=$(python publikuj.py zbyva)
          echo "quota left today: $n"
          if [ "$n" -gt 0 ]; then python klipuj.py --whisper small.en batch --max "$n" --yt ${{ inputs.yt || '3' }}; fi

      - name: publish to Buffer
        if: (inputs.url == '' || inputs.publikovat == 'ano') && env.BUFFER_API_KEY_1 != '' && env.NETLIFY_AUTH_TOKEN != ''
        run: python publikuj.py den --den dnes --n 10 ${{ vars.OSTRE == '1' && '--ostre' || '' }}

      - name: keep the shorts for 3 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/*/*/short_9x16.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: save state
        if: always()
        run: |
          git config user.name "gta6bananaclips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json streamers.json publikovano.json buffer.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || { git commit -q -m "stav: denni beh $(date -u +%F)" && git pull -q --rebase && git push -q; }
