# gta6bananaclips: every day on GitHub's servers (no home PC needed)
#   1. klipuj.py batch   -> render the best fresh moments (Twitch, Kick, YouTube)
#   2. publikuj.py den   -> deploy videos to Netlify + schedule today's slots in Buffer
#   3. commit state      -> what was rendered / published / which facecam boxes
# Buffer then publishes on its own during the day.
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   BUFFER_API_KEY_1, BUFFER_API_KEY_2, NETLIFY_AUTH_TOKEN
#   BUFFER_API_KEY_3, BUFFER_API_KEY_4 (second account gta6fanpageclip, brands.json -> fanpage)
# Variables (same page -> Variables):
#   NETLIFY_SITE_ID, MEDIA_BASE_URL, OSTRE (set to 1 to schedule for real; otherwise Buffer drafts)
# YouTube is off here: it blocks GitHub's servers ("confirm you're not a bot").

name: denne-klipy

on:
  schedule:                        # every 30 min (public repo = free minutes); all runs share one daily quota
    - cron: "*/30 * * * *"
    # launch of GTA 6 (19. 11.) and the day after: a conveyor belt every 5 min (UTC days 19-21 cover
    # the whole Prague publishing day). Runs queue in the 'denne' group, so they go back to back.
    - cron: "5-55/5 * 19-21 11 *"
  workflow_dispatch:
    inputs:
      max:
        description: "max shorts to render (empty = today's ramp quota from sources.json)"
        default: ""
      yt:
        description: "of which from YouTube (default 0: needs fresh cookies, Google revokes them on GitHub)"
        default: ""
      url:
        description: "test: render just this one clip URL"
        default: ""
      publikovat:
        description: "test: publish that one clip too (ano/ne)"
        default: "ne"
      jen_publikace:
        description: "only publish (live hot path: no render, no torch install -> minutes faster)"
        default: "ne"

permissions:
  contents: write

concurrency:
  group: denne
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BUFFER_API_KEY_1: ${{ secrets.BUFFER_API_KEY_1 }}
      BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
      BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}          # second account gta6fanpageclip
      BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}          # Twitch API: clips of the whole GTA VI category
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: denoland/setup-deno@v2      # yt-dlp solves YouTube's JS challenge with deno
        with:
          deno-version: v2.x

      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: python deps (CPU torch, no GPU on the runner)
        if: inputs.jen_publikace != 'ano'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - uses: actions/cache@v4
        with:
          path: models/whisper
          key: whisper-small.en

      - name: warn when secrets are missing (publishing would be skipped silently)
        if: env.BUFFER_API_KEY_1 == '' || env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::error::Chybi secret BUFFER_API_KEY_1 nebo NETLIFY_AUTH_TOKEN - nic se nepublikuje."

      - name: YouTube cookies (GitHub servers are asked "confirm you're not a bot" without them)
        if: env.YT_COOKIES != ''
        run: |
          echo "$YT_COOKIES" | tr -d '\r' > youtube_cookies.txt
          echo "cookie file: $(wc -l < youtube_cookies.txt) lines; fields per line:"
          awk -F'\t' '!/^#/ && NF {print NF}' youtube_cookies.txt | sort | uniq -c

      - name: Buffer channels (first run only)
        if: inputs.url == '' && hashFiles('buffer.json') == '' && env.BUFFER_API_KEY_1 != ''
        run: python publikuj.py kanaly

      - name: Buffer channels, fanpage account (first run only)
        if: inputs.url == '' && hashFiles('buffer_fanpage.json') == '' && env.BUFFER_API_KEY_3 != ''
        run: python publikuj.py kanaly --znacka fanpage

      - name: render one test clip
        if: inputs.url != ''
        run: |
          case "${{ inputs.url }}" in
            *youtube.com*|*youtu.be*) python klipuj.py --whisper small.en yt "${{ inputs.url }}" --n 1 ;;
            *) python klipuj.py --whisper small.en one "${{ inputs.url }}" ;;
          esac

      - name: render (only as many as today's quota still allows)
        if: inputs.url == '' && inputs.jen_publikace != 'ano'
        run: |
          n="${{ inputs.max }}"
          if [ -z "$n" ]; then
            # each clip goes to ONE brand (alternating; very viral ones to both): render what both still need
            a=$(python publikuj.py zbyva --znacka bananas 2>/dev/null || python publikuj.py zbyva)
            b=$(python publikuj.py zbyva --znacka fanpage 2>/dev/null || echo 0)
            echo "quota left: bananas $a, fanpage $b"
            n=$(( a + b ))
          fi
          echo "quota left today: $n"
          yt="${{ inputs.yt }}"
          # YouTube discovery is slow (detail + comments per video): only in the morning run
          # YouTube is OFF on the server: Google revokes the cookies within hours when GitHub's IPs use them
          # (seen twice on 14. 11.) and without cookies it blocks GitHub completely. YouTube runs from the PC.
          [ -z "$yt" ] && yt=0
          echo "youtube moments this run: $yt"
          if [ "$n" -gt 0 ]; then python klipuj.py --whisper small.en batch --max "$n" --yt "$yt"; fi

      # experiments (experimenty.py): at most 1 a day per account, outside the quota, only when the day's data
      # has strong material of the right kind; `den` posts it in its own slot. Never on the live hot path.
      - name: experiment of the day (data-gated)
        if: inputs.url == '' && inputs.jen_publikace != 'ano'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          python experimenty.py vyrob --znacka bananas
          python experimenty.py vyrob --znacka fanpage

      - name: publish to Buffer
        if: (inputs.url == '' || inputs.publikovat == 'ano') && env.BUFFER_API_KEY_1 != '' && env.NETLIFY_AUTH_TOKEN != ''
        run: python publikuj.py den --den dnes --n 10 ${{ vars.OSTRE == '1' && '--ostre' || '' }}

      - name: publish to Buffer, fanpage account
        if: (inputs.url == '' || inputs.publikovat == 'ano') && env.BUFFER_API_KEY_3 != '' && env.NETLIFY_AUTH_TOKEN != '' && hashFiles('buffer_fanpage.json') != ''
        run: python publikuj.py den --den dnes --n 10 --znacka fanpage ${{ vars.OSTRE == '1' && '--ostre' || '' }}

      - name: experiment stats (Buffer post metrics 48 h after publishing, read-only; 1x per 20 h)
        if: inputs.jen_publikace != 'ano' && env.BUFFER_API_KEY_1 != ''
        continue-on-error: true
        run: python experimenty.py mer

      - name: keep the shorts for 3 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: |
            out/*/*/short_9x16.mp4
            out/*/*/short_fanpage.mp4
            out/_exp/*/*/exp.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: save state
        if: always()
        run: |
          git config user.name "gta6bananaclips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json streamers.json publikovano.json buffer.json publikovano_fanpage.json buffer_fanpage.json long_pool.json experimenty.json netlify_extra.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || { git commit -q -m "stav: denni beh $(date -u +%F)" && git pull -q --rebase && git push -q; }
