# gta6bananaclips: every day on GitHub's servers (no home PC needed)
#   1. klipuj.py batch   -> render the best fresh moments (Twitch, Kick, YouTube)
#   2. publikuj.py den   -> deploy videos to Netlify + schedule today's slots in Buffer
#   3. commit state      -> what was rendered / published / which facecam boxes
# Buffer then publishes on its own during the day.
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   BUFFER_API_KEY_1, BUFFER_API_KEY_2, NETLIFY_AUTH_TOKEN
#   BUFFER_API_KEY_3, BUFFER_API_KEY_4 (second account gta6fanpageclip, brands.json -> fanpage)
# Variables (same page -> Variables):
#   NETLIFY_SITE_ID, MEDIA_BASE_URL, OSTRE (set to 1 to schedule for real; otherwise Buffer drafts)
# YouTube is off here: it blocks GitHub's servers ("confirm you're not a bot").

name: denne-klipy

on:
  schedule:                        # every 30 min (public repo = free minutes); all runs share one daily quota
    - cron: "*/30 * * * *"
    # launch of GTA 6 (19. 11.) and the day after: a conveyor belt every 5 min (UTC days 19-21 cover
    # the whole Prague publishing day). Runs queue in the 'denne' group, so they go back to back.
    - cron: "5-55/5 * 18-21 11 *"
  workflow_dispatch:
    inputs:
      max:
        description: "max shorts to render (empty = today's ramp quota from sources.json)"
        default: ""
      yt:
        description: "of which from YouTube (default 0: needs fresh cookies, Google revokes them on GitHub)"
        default: ""
      url:
        description: "test: render just this one clip URL"
        default: ""
      publikovat:
        description: "test: publish that one clip too (ano/ne)"
        default: "ne"
      jen_publikace:
        description: "only publish (live hot path: no render, no torch install -> minutes faster)"
        default: "ne"

permissions:
  contents: write

# Normal runs queue in 'denne' (render can take tens of minutes). The live fast path (jen_publikace=ano,
# dispatched by live.yml) has its own group, so it never waits behind a render; the two never publish
# at the same moment because the publishing part holds a lock in git (publikuj.py zamek), and the fast
# path writes its own record files (publikovano_live.json, publikovano_fanpage_live.json).
concurrency:
  group: ${{ inputs.jen_publikace == 'ano' && 'denne-live' || 'denne' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BUFFER_API_KEY_1: ${{ secrets.BUFFER_API_KEY_1 }}
      BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
      BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}          # second account gta6fanpageclip
      BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}          # Twitch API: clips of the whole GTA VI category
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: denoland/setup-deno@v2      # yt-dlp solves YouTube's JS challenge with deno
        if: inputs.jen_publikace != 'ano'
        with:
          deno-version: v2.x

      # static ffmpeg 9.0 (pinned BtbN build, cached): apt-get took 5-15 min per run on a slow mirror
      - uses: actions/cache@v4
        if: inputs.jen_publikace != 'ano'
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-btbn-n9.0.2-57-linux64-gpl-v1

      - name: ffmpeg
        if: inputs.jen_publikace != 'ano'   # the fast path posts ready shorts (no Top 3, no render)
        run: bash .github/ffmpeg.sh

      - name: python deps (CPU torch, no GPU on the runner)
        if: inputs.jen_publikace != 'ano'
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - uses: actions/cache@v4
        if: inputs.jen_publikace != 'ano'
        with:
          path: models/whisper
          key: whisper-small.en

      - name: warn when secrets are missing (publishing would be skipped silently)
        if: env.BUFFER_API_KEY_1 == '' || env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::error::Chybi secret BUFFER_API_KEY_1 nebo NETLIFY_AUTH_TOKEN - nic se nepublikuje."

      - name: YouTube cookies (GitHub servers are asked "confirm you're not a bot" without them)
        if: env.YT_COOKIES != ''
        run: |
          echo "$YT_COOKIES" | tr -d '\r' > youtube_cookies.txt
          echo "cookie file: $(wc -l < youtube_cookies.txt) lines; fields per line:"
          awk -F'\t' '!/^#/ && NF {print NF}' youtube_cookies.txt | sort | uniq -c

      - name: Buffer channels (first run only)
        if: inputs.url == '' && hashFiles('buffer.json') == '' && env.BUFFER_API_KEY_1 != ''
        run: python publikuj.py kanaly

      - name: Buffer channels, fanpage account (first run only)
        if: inputs.url == '' && hashFiles('buffer_fanpage.json') == '' && env.BUFFER_API_KEY_3 != ''
        run: python publikuj.py kanaly --znacka fanpage

      - name: render one test clip
        if: inputs.url != ''
        run: |
          case "${{ inputs.url }}" in
            *youtube.com*|*youtu.be*) python klipuj.py --whisper small.en yt "${{ inputs.url }}" --n 1 ;;
            *) python klipuj.py --whisper small.en one "${{ inputs.url }}" ;;
          esac

      - name: render (just in time, only what this run can post)
        if: inputs.url == '' && inputs.jen_publikace != 'ano'
        run: |
          yt="${{ inputs.yt }}"
          # YouTube is OFF on the server: Google revokes the cookies within hours when GitHub's IPs use them
          # (seen twice on 14. 11.) and without cookies it blocks GitHub completely. YouTube runs from the PC.
          [ -z "$yt" ] && yt=0
          n="${{ inputs.max }}"
          if [ -n "$n" ]; then
            python klipuj.py --whisper small.en batch --max "$n" --yt "$yt"
            exit 0
          fi
          # The same plan as `publikuj.py den` (publikuj.day_plan): slots due in the next plan_horizon_h
          # + catch-up for the day's minimum + room for hot clips. A clip rendered but not posted in this
          # run is lost (the runner's out/ is gone next time), so never the whole day at once.
          # Each clip goes to ONE brand: the one with open slots now (--brand-need), then hot room.
          read -r an ao ag gs es ah hs <<< "$(python publikuj.py zbyva --plan --znacka bananas)"
          read -r bn bo bg bgs bes bh _ <<< "$(python publikuj.py zbyva --plan --znacka fanpage || echo 0 0 0 1000 5000 0 2000)"
          n=$(( an + bn )); owed=$(( ao + bo )); goodn=$(( ag + bg )); hot=$(( ah + bh ))
          # a paused brand (Netlify hard limit: "0 0 0 0 0 0 0") must not lower the thresholds to 0
          if [ "$bgs" -gt 0 ] && [ "$bgs" -lt "$gs" ]; then gs=$bgs; fi
          if [ "$bes" -gt 0 ] && [ "$bes" -lt "$es" ]; then es=$bes; fi
          echo "plan: bananas need $an (catch-up $ao, good $ag) hot room $ah | fanpage need $bn (catch-up $bo, good $bg) hot room $bh"
          if [ "$n" -gt 0 ] || [ "$hot" -gt 0 ]; then
            python klipuj.py --whisper small.en batch --max "$n" --owed "$owed" --good-n "$goodn" \
              --min-score "$gs" --extra-score "$es" --hot "$hot" --hot-score "$hs" --yt "$yt" \
              --brand-need "bananas=$ao/$(( an - ao ))/$ah,fanpage=$bo/$(( bn - bo ))/$bh"
          fi

      # experiments (experimenty.py): at most 1 a day per account, outside the quota, only when the day's data
      # has strong material of the right kind; `den` posts it in its own slot. Never on the live hot path.
      - name: experiment of the day (data-gated)
        if: inputs.url == '' && inputs.jen_publikace != 'ano'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          # each brand on its own clock: a stuck bananas experiment never costs the fanpage one
          timeout 12m python experimenty.py vyrob --znacka bananas || echo "::warning::experiment bananas failed"
          timeout 12m python experimenty.py vyrob --znacka fanpage || echo "::warning::experiment fanpage failed"

      # one publisher at a time (normal run or live fast path): lock in git, then the freshest records
      # of both writers (another run may have posted while this one rendered or waited)
      - name: publishing lock
        id: zamek
        if: ${{ !cancelled() && (inputs.url == '' || inputs.publikovat == 'ano') && env.BUFFER_API_KEY_1 != '' && env.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          rm -f zamek_ztracen zamek_do
          python publikuj.py zamek vezmi --kdo "${{ github.run_id }}-${{ github.run_attempt }}" --ttl 20 \
            --cekej ${{ inputs.jen_publikace == 'ano' && '25' || '40' }}
          # keep the lock alive while this job publishes (dies with the job; then it expires in 20 min)
          nohup python publikuj.py zamek obnov --kdo "${{ github.run_id }}-${{ github.run_attempt }}" --ttl 20 \
            > zamek_obnov.log 2>&1 &
          git fetch -q origin main
          for f in publikovano.json publikovano_fanpage.json publikovano_live.json publikovano_fanpage_live.json publikace_chyby.json; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then git show "origin/main:$f" > "$f"; fi
          done

      # each brand runs even when the other failed (always() + the lock): one account's trouble never
      # costs the other account its posts
      - name: publish to Buffer
        if: always() && steps.zamek.outcome == 'success'
        run: python publikuj.py den --den dnes --n 10 ${{ inputs.jen_publikace == 'ano' && '--rychle' || '' }} ${{ vars.OSTRE == '1' && '--ostre' || '' }}

      - name: publish to Buffer, fanpage account
        if: always() && steps.zamek.outcome == 'success' && env.BUFFER_API_KEY_3 != '' && hashFiles('buffer_fanpage.json') != ''
        run: python publikuj.py den --den dnes --n 10 --znacka fanpage ${{ inputs.jen_publikace == 'ano' && '--rychle' || '' }} ${{ vars.OSTRE == '1' && '--ostre' || '' }}

      # the records go to origin in the same commit that frees the lock (merged per key, never lost)
      - name: save publication records + release the lock
        if: always() && steps.zamek.outcome == 'success'
        run: |
          pkill -f "publikuj.py zamek obnov" || true
          cat zamek_obnov.log 2>/dev/null || true
          python publikuj.py zamek pust --kdo "${{ github.run_id }}-${{ github.run_attempt }}" --uloz \
            ${{ inputs.jen_publikace == 'ano' && 'publikovano_live.json publikovano_fanpage_live.json' || 'publikovano.json publikovano_fanpage.json' }} publikace_chyby.json

      - name: experiment stats (Buffer post metrics 48 h after publishing, read-only; 1x per 20 h)
        if: inputs.jen_publikace != 'ano' && env.BUFFER_API_KEY_1 != ''
        continue-on-error: true
        run: python experimenty.py mer

      - name: keep the shorts for 3 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: |
            out/*/*/short_9x16.mp4
            out/*/*/short_fanpage.mp4
            out/_exp/*/*/exp.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: save state
        if: always()
        run: |
          git config user.name "gta6bananaclips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the publication records (publikovano*.json, publikace_chyby.json) go to origin ONLY through the lock
          # (zamek pust --uloz / push_records, merged per key); committing them here too made the rebase
          # conflict with the fast path and lost state.json / long_pool.json with them
          for f in publikovano.json publikovano_fanpage.json publikovano_live.json publikovano_fanpage_live.json publikace_chyby.json publikace_zamek.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git checkout -q -- "$f"; else rm -f "$f"; fi
          done
          for f in state.json streamers.json buffer.json buffer_fanpage.json long_pool.json experimenty.json netlify_extra.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "stav: denni beh $(date -u +%F)"
          # another workflow may push in between (denne / long / live dispatches): retry, never lose the state
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase --autostash; then git push -q && exit 0; else git rebase --abort 2>/dev/null || true; fi
            sleep $((i * 5 + RANDOM % 7))
          done
          echo "::error::stav se nepodarilo pushnout (6 pokusu)"; exit 1
