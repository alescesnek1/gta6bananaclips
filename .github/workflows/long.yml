# Long-form YouTube compilations (docs/long-form.md), both accounts, uploaded by hand by Aleš:
#   1. kompilace.py   -> pick + cut 20-40 moments into an 8-15 min 16:9 video, chapters, credits
#   2. nahled / nahled_ai -> thumbnail inputs + AI thumbnail (Cloudflare Workers AI, if keys)
#   3. artifact       -> the video for download (3 days)
#   4. posli_mail.py  -> e-mail with title, description, tags, thumbnail(s) and the download link
# Every 2 h (Aleš 18. 11.: "upload as soon as we have a stock of clips", no calendar day, no day ahead).
# Per brand: the cap (1 episode per brands.json long_min_gap_h, 20 h) -> the next series of the rotation
# (brands.json -> long_calendar.rotation; the channel's first episode = first reactions) -> a strong
# episode in the pool (long_target_min after cuts, never < 5 min)? build now + e-mail "NAHRÁT HNED" now :
# a silent .skip.json (no e-mail). Triggers: this cron (fallback) + the 24/7 PC's dispatch every 2 h
# (worker/beh.ps1). Manual: Actions -> Run workflow.
#
# Secrets: TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET (moments of the GTA VI category),
#          CF_ACCOUNT_ID, CF_API_TOKEN (AI thumbnail; without: no thumbnail),
#          MAIL_FROM, MAIL_APP_PASSWORD, MAIL_TO (Gmail; without: the e-mail goes to the job log)
# Note: GitHub cron of a public repo can run hours late (seen 16. 11.); the window of every series is
# "since its last episode" (long_episodes.json -> _series_at), so a late or doubled run loses nothing.

name: long-form

on:
  # 25. 11. (owner: "na long form kašleme"): no schedule - manual only (Actions -> Run workflow)
  # 20. 11. (owner): the long-form is built HERE again, primarily on GitHub; the PC only dispatches this run
  workflow_dispatch:
    inputs:
      znacka:
        description: "obe / bananas / fanpage"
        default: "obe"
      serie:
        description: "empty = the rotation (brands.json long_calendar); or e.g. chases, top-week, streamer:<login>"
        default: ""
      od:
        description: "first day YYYY-MM-DD (empty = since the series' last episode)"
        default: ""
      do:
        description: "last day YYYY-MM-DD"
        default: ""
      hra:
        description: "test only: other Twitch category, e.g. Grand Theft Auto V"
        default: ""
      delka:
        description: "test only: target length in seconds (e.g. 90), min length drops to 30 s"
        default: ""

permissions:
  contents: write

concurrency:
  group: long
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      # two triggers every 2 h (cron + the 24/7 PC's dispatch): the second run waits in the concurrency queue
      # and must see the state the first one pushed (long_episodes.json -> _last = the cap), not the commit it
      # was triggered on -> one video and one e-mail per brand and long_min_gap_h
      - name: latest state
        run: git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # static ffmpeg 9.0 (pinned BtbN build, cached): apt-get took 5-15 min per run on a slow mirror
      - uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-btbn-n9.0.2-57-linux64-gpl-v1

      - name: ffmpeg
        run: bash .github/ffmpeg.sh

      - name: python deps (CPU torch)
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - uses: actions/cache@v4
        with:
          path: models/whisper
          key: whisper-small.en

      - name: what to make
        id: plan
        run: |
          z="${{ inputs.znacka }}"; s="${{ inputs.serie }}"
          [ -z "$z" ] && z=obe
          echo "brands=$([ "$z" = obe ] && echo 'bananas fanpage' || echo "$z")" >> "$GITHUB_OUTPUT"
          echo "serie=$s" >> "$GITHUB_OUTPUT"
          echo "plan: $z / ${s:-daily series}"

      - name: compile
        timeout-minutes: 290                # a hung compile must still leave time for the e-mails below
        run: |
          extra=""
          [ -n "${{ inputs.od }}" ] && extra="$extra --od ${{ inputs.od }}"
          [ -n "${{ inputs.do }}" ] && extra="$extra --do ${{ inputs.do }}"
          [ -n "${{ inputs.delka }}" ] && extra="$extra --delka ${{ inputs.delka }} --min-video 60 --min-momentu 6 --min-overeno 3"
          brands="${{ steps.plan.outputs.brands }}"
          left=$(echo $brands | wc -w)
          for z in $brands; do
            left=$((left - 1))
            export LONG_BRANDS_AFTER=$left   # AI thumbnail budget: leave the next brand its share
            s="${{ steps.plan.outputs.serie }}"
            if [ -n "${{ inputs.hra }}" ]; then
              python kompilace.py --znacka "$z" ${s:+--serie "$s"} $extra --hra "${{ inputs.hra }}" || echo "::warning::kompilace $z selhala"
            else
              python kompilace.py --znacka "$z" ${s:+--serie "$s"} $extra || echo "::warning::kompilace $z selhala"
            fi
          done
          ls -la out/_long/*/ 2>/dev/null || true

      - name: video bananas (artifact, 3 days)
        id: art_b
        if: hashFiles('out/_long/bananas/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-bananas
          path: out/_long/bananas/*.mp4
          retention-days: 3
          compression-level: 0

      - name: video fanpage (artifact, 3 days)
        id: art_f
        if: hashFiles('out/_long/fanpage/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-fanpage
          path: out/_long/fanpage/*.mp4
          retention-days: 3
          compression-level: 0

      - name: thumbnails + texts (artifact)
        if: hashFiles('out/_long/*/*.meta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-nahledy
          path: |
            out/_long/*/*.meta.json
            out/_long/*/*/nahled*.jpg
          retention-days: 7

      # 19. 11.: the artifact link needs a GitHub sign-in (404 for Ales) -> the video also goes to a GitHub
      # Release asset: a plain public download, no sign-in, up to 2 GB; releases older than 4 days are deleted
      - name: public download link (release)
        id: rel
        if: always() && hashFiles('out/_long/*/*.mp4') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for z in bananas fanpage; do
            f=$(ls out/_long/$z/*.mp4 2>/dev/null | head -1)
            [ -n "$f" ] || continue
            tag="long-$z-$(date -u +%Y%m%d-%H%M)"
            name="$(basename "$f")"
            gh release create "$tag" "$f" --title "$z $name" --notes "Long-form ke stazeni (smaze se po 4 dnech)" --prerelease               && echo "$z=https://github.com/${{ github.repository }}/releases/download/$tag/$name" >> "$GITHUB_OUTPUT"
          done
          # old download releases out (the video lives on YouTube by then)
          gh release list --limit 100 --json tagName,createdAt -q '.[] | select(.tagName | startswith("long-")) | "\(.tagName) \(.createdAt)"' |
            while read t c; do
              [ $(( $(date +%s) - $(date -d "$c" +%s) )) -gt 345600 ] && gh release delete "$t" --yes --cleanup-tag || true
            done

      # a video without its artifact link still gets its e-mail (the link line says it is missing)
      - name: e-mail bananas
        id: mail_b
        continue-on-error: true            # one failed e-mail must not swallow the next one
        if: always() && hashFiles('out/_long/bananas/*.meta.json') != ''
        run: python posli_mail.py out/_long/bananas/*.meta.json --odkaz "${{ steps.rel.outputs.bananas || steps.art_b.outputs.artifact-url }}"

      - name: e-mail fanpage
        id: mail_f
        continue-on-error: true            # one failed e-mail must not swallow the next one
        if: always() && hashFiles('out/_long/fanpage/*.meta.json') != ''
        run: python posli_mail.py out/_long/fanpage/*.meta.json --odkaz "${{ steps.rel.outputs.fanpage || steps.art_f.outputs.artifact-url }}"

      # never silence (Aleš 18. 11.): a brand that left neither a video, nor a failed note, nor a skip mark
      # (crash, timeout, kill) gets a failed note now + the retry wait (_fail), so it does not mail every 2 h
      - name: missing result -> failed note
        if: always()
        run: |
          z="${{ inputs.znacka }}"; [ -z "$z" ] && z=obe        # not from the plan step: it may never have run
          for z in $([ "$z" = obe ] && echo bananas fanpage || echo "$z"); do
            compgen -G "out/_long/$z/*.meta.json" >/dev/null && continue
            compgen -G "out/_long/$z/*.failed.json" >/dev/null && continue
            compgen -G "out/_long/$z/*.skip.json" >/dev/null && continue
            mkdir -p out/_long/$z
            python - "$z" <<'PY'
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          z = sys.argv[1]
          now = datetime.now(ZoneInfo("Europe/Prague"))
          kdy = now.strftime("%Y-%m-%d_%H%M")
          json.dump({"znacka": z, "serie": "?", "publish_day": kdy[:10], "kdy": kdy,
                     "duvod": "kompilace skončila bez videa i bez zprávy (pád, časový limit) - viz log běhu"},
                    open(f"out/_long/{z}/{kdy}_crash.failed.json", "w", encoding="utf-8"), ensure_ascii=False)
          try:
              eps = json.load(open("long_episodes.json", encoding="utf-8"))
          except Exception:
              eps = {}
          eps.setdefault("_fail", {})[z] = now.isoformat(timespec="seconds")
          json.dump(eps, open("long_episodes.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          done

      - name: e-mail about a video that failed (no link)
        continue-on-error: true            # one failed e-mail must not swallow the next one
        if: always() && hashFiles('out/_long/*/*.failed.json') != ''
        run: python posli_mail.py out/_long/*/*.failed.json

      # the e-mail of a video did not go out: its state goes back (number, used moments, reserve), so the
      # numbering never skips a video Aleš never got
      - name: roll back the state of a video whose e-mail failed
        if: always()
        run: |
          if [ -n "$(ls out/_long/bananas/*.meta.json 2>/dev/null)" ] && [ "${{ steps.mail_b.outcome }}" != "success" ]; then
            for f in out/_long/bananas/*.meta.json; do python kompilace.py --vratit "$f"; done
          fi
          if [ -n "$(ls out/_long/fanpage/*.meta.json 2>/dev/null)" ] && [ "${{ steps.mail_f.outcome }}" != "success" ]; then
            for f in out/_long/fanpage/*.meta.json; do python kompilace.py --vratit "$f"; done
          fi

      - name: save state (used moments, episodes, reserve, vision answers, AI budget)
        if: always()
        run: |
          git config user.name "gta6bananaclips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 20. 11.: long_pool.json (the moments' classification) was thrown away here, so every run classified
          # ~200 clips again (2-4 h). Now this run's copies are merged key by key into origin's (tools/merge_state.py)
          git checkout -- streamers.json 2>/dev/null || true
          FILES="long_used.json long_episodes.json long_reserve.json long_vision.json long_pool.json nahled_ai_budget.json"
          OURS=$(mktemp -d)
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OURS/"; done
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/merge_state.py "$OURS" $FILES
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            git diff --cached --quiet && exit 0
            git commit -q -m "stav: long-form $(date -u +%F)"
            git push -q && exit 0
            sleep $((i * 5 + RANDOM % 7))
          done
          echo "::error::stav se nepodarilo pushnout (5 pokusu)"; exit 1
