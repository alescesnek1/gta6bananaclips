# Long-form YouTube compilations (docs/long-form.md), both accounts, uploaded by hand by Aleš:
#   1. kompilace.py   -> pick + cut 20-40 moments into an 8-15 min 16:9 video, chapters, credits
#   2. nahled / nahled_ai -> thumbnail inputs + AI thumbnail (Cloudflare Workers AI, if keys)
#   3. artifact       -> the video for download (3 days)
#   4. posli_mail.py  -> e-mail with title, description, tags, thumbnail(s) and the download link
# Daily at ~00:25 Prague: the video for TOMORROW (the e-mail arrives a day ahead). Which series runs on
# which day is the calendar in brands.json -> long_calendar (themed series fall back to the main one
# when they lack verified moments; at most 1 video per channel per day). Manual: Actions -> Run workflow.
#
# Secrets: TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET (moments of the GTA VI category),
#          CF_ACCOUNT_ID, CF_API_TOKEN (AI thumbnail; without: no thumbnail),
#          MAIL_FROM, MAIL_APP_PASSWORD, MAIL_TO (Gmail; without: the e-mail goes to the job log)
# Note: GitHub cron of a public repo can run hours late (seen 16. 11.); the run uses "yesterday"
# in Prague time, so a late run still compiles the right day.

name: long-form

on:
  schedule:
    - cron: "25 23 * * *"          # 00:25 Prague (winter)
  workflow_dispatch:
    inputs:
      znacka:
        description: "obe / bananas / fanpage"
        default: "obe"
      serie:
        description: "empty = the calendar (brands.json long_calendar); or e.g. chases, top-week, streamer:<login>"
        default: ""
      den:
        description: "publish day YYYY-MM-DD (empty = tomorrow)"
        default: ""
      od:
        description: "first day YYYY-MM-DD (empty = yesterday / last 7 days for top-week)"
        default: ""
      do:
        description: "last day YYYY-MM-DD"
        default: ""
      hra:
        description: "test only: other Twitch category, e.g. Grand Theft Auto V"
        default: ""
      delka:
        description: "test only: target length in seconds (e.g. 90), min length drops to 30 s"
        default: ""

permissions:
  contents: write

concurrency:
  group: long
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - uses: actions/cache@v4
        with:
          path: models/whisper
          key: whisper-small.en

      - name: what to make
        id: plan
        run: |
          z="${{ inputs.znacka }}"; s="${{ inputs.serie }}"
          [ -z "$z" ] && z=obe
          echo "brands=$([ "$z" = obe ] && echo 'bananas fanpage' || echo "$z")" >> "$GITHUB_OUTPUT"
          echo "serie=$s" >> "$GITHUB_OUTPUT"
          echo "plan: $z / ${s:-daily series}"

      - name: compile
        run: |
          extra=""
          [ -n "${{ inputs.od }}" ] && extra="$extra --od ${{ inputs.od }}"
          [ -n "${{ inputs.do }}" ] && extra="$extra --do ${{ inputs.do }}"
          [ -n "${{ inputs.den }}" ] && extra="$extra --den ${{ inputs.den }}"
          [ -n "${{ inputs.delka }}" ] && extra="$extra --delka ${{ inputs.delka }} --min-video 60 --min-momentu 6 --min-overeno 3"
          for z in ${{ steps.plan.outputs.brands }}; do
            s="${{ steps.plan.outputs.serie }}"
            if [ -n "${{ inputs.hra }}" ]; then
              python kompilace.py --znacka "$z" ${s:+--serie "$s"} $extra --hra "${{ inputs.hra }}" || echo "::warning::kompilace $z selhala"
            else
              python kompilace.py --znacka "$z" ${s:+--serie "$s"} $extra || echo "::warning::kompilace $z selhala"
            fi
          done
          ls -la out/_long/*/ 2>/dev/null || true

      - name: video bananas (artifact, 3 days)
        id: art_b
        if: hashFiles('out/_long/bananas/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-bananas
          path: out/_long/bananas/*.mp4
          retention-days: 3
          compression-level: 0

      - name: video fanpage (artifact, 3 days)
        id: art_f
        if: hashFiles('out/_long/fanpage/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-fanpage
          path: out/_long/fanpage/*.mp4
          retention-days: 3
          compression-level: 0

      - name: thumbnails + texts (artifact)
        if: hashFiles('out/_long/*/*.meta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-nahledy
          path: |
            out/_long/*/*.meta.json
            out/_long/*/*/nahled*.jpg
          retention-days: 7

      - name: e-mail bananas
        continue-on-error: true            # one failed e-mail must not swallow the next one
        if: steps.art_b.outputs.artifact-url != ''
        run: python posli_mail.py out/_long/bananas/*.meta.json --odkaz "${{ steps.art_b.outputs.artifact-url }}"

      - name: e-mail fanpage
        continue-on-error: true            # one failed e-mail must not swallow the next one
        if: steps.art_f.outputs.artifact-url != ''
        run: python posli_mail.py out/_long/fanpage/*.meta.json --odkaz "${{ steps.art_f.outputs.artifact-url }}"

      - name: e-mail about a video that failed QA (no link)
        continue-on-error: true            # one failed e-mail must not swallow the next one
        if: hashFiles('out/_long/*/*.failed.json') != ''
        run: python posli_mail.py out/_long/*/*.failed.json

      - name: save state (used moments, episodes, reserve, AI budget)
        if: always()
        run: |
          git config user.name "gta6bananaclips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- long_pool.json streamers.json 2>/dev/null || true   # written by denne.yml, avoid conflicts
          for f in long_used.json long_episodes.json long_reserve.json nahled_ai_budget.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "stav: long-form $(date -u +%F)"
          # another workflow may push in between (denne / long / live dispatches): retry, never lose the state
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 7)); done
          echo "::error::stav se nepodarilo pushnout (5 pokusu)"; exit 1
