# gta6bananaclips: LIVE conveyor belt (from 18. 11. 00:00 Prague, sources.json live_from)
#   klipuj.py live -> watches the chat of the biggest live English GTA VI streams (anonymous,
#   read-only), on a chat explosion cuts the last ~40 s from the running stream's live VOD,
#   renders it, puts it on the live-inbox (Netlify draft) and starts 'denne-klipy' to publish.
# One job runs ~5.7 h (GitHub limit 6 h). The 24/7 PC dispatches this workflow every 30 min;
# in the 'live' group a new run waits until the current one ends -> it runs back to back.

name: live-klipy

on:
  schedule:
    - cron: "0 */6 * * *"         # backup if the PC is off (GitHub's schedule is unreliable)
  workflow_dispatch:
    inputs:
      hra:
        description: "test: other Twitch category, e.g. 'Grand Theft Auto V' (empty = GTA VI)"
        default: ""
      hodin:
        description: "how long to watch (h)"
        default: "5.7"

permissions:
  contents: read
  actions: write                 # to start 'denne-klipy' right after a live short

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - name: job start time (the watch time is what is left of the 6 h)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # static ffmpeg 9.0 (pinned BtbN build, cached): apt-get took 5-15 min per run on a slow mirror
      - uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-btbn-n9.0.2-57-linux64-gpl-v1

      - name: ffmpeg
        run: bash .github/ffmpeg.sh

      - name: python deps (CPU torch)
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - uses: actions/cache@v4
        with:
          path: models/whisper
          key: whisper-small.en

      - name: watch live chats and clip the explosions
        run: |
          # watch until 340 min after the job start (setup included), then up to 15 min to finish the
          # queued renders; the job timeout is 360 min, so it is never killed in the middle of a short
          left=$(( 340 * 60 - ($(date +%s) - JOB_T0) ))
          hours=$(python -c "print(round(max(0.2, min(float('${{ inputs.hodin || '5.7' }}'), $left / 3600)), 2))")
          echo "watching $hours h"
          args="--hours $hours"
          if [ -n "${{ inputs.hra }}" ]; then args="$args --ted --hra '${{ inputs.hra }}'"; fi
          eval python klipuj.py --whisper small.en live $args
